<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aditi's Website</title>
  <link rel="icon" type="image/x-icon" href="/images/a_pfp.jpg">
  <link rel="stylesheet" type="text/css" href="style.css" media="all">
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
  </script>
  <style>
    :root {
      --g-outline-1: #F5EEFF;
      --g-outline-2: #D7C5F2;
      --g-outline-3: #C7A8E4;
      --g-outline-4: #9878C8;
      --g-stem:    #9ec47a;
      --g-grass:   #4a7830;
      --g-grass-dk:#2a5018;
      --g-star:    #ffffff;
      --g-center:  #FFE9A8;
    }
    [data-theme="light"] {
      --g-outline-1: #6E4A9E;
      --g-outline-2: #8A66B8;
      --g-outline-3: #A888D0;
      --g-outline-4: #4A3070;
      --g-stem:    #6a9848;
      --g-grass:   #7aa850;
      --g-grass-dk:#5a8030;
      --g-star:    transparent;
      --g-center:  #FFD86B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .star {
      position: absolute;
      background: var(--g-star);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.6;
    }
    [data-theme="light"] .star { display: none; }

    nav {
      position: absolute;
      top: 14px; left: 18px;
      z-index: 20;
      font-family: Montserrat, Monaco, Garamond;
      font-size: 0.95em;
    }

    .greeting {
      position: absolute;
      top: 72px;
      left: 18px;
      pointer-events: none;
      z-index: 10;
    }
    .greeting h1 {
      font-size: 1.8em;
      margin-bottom: 0.15em;
    }
    .greeting p {
      font-size: 0.85em;
      opacity: 0.8;
    }

    .grass {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 68px;
      background: linear-gradient(180deg, var(--g-grass) 0%, var(--g-grass-dk) 100%);
      z-index: 6;
    }
    .grass svg {
      position: absolute;
      top: -20px; left: 0;
      width: 100%; height: 24px;
    }

    #garden {
      position: absolute;
      bottom: 62px; left: 0;
      width: 100%;
      height: calc(100vh - 62px);
      z-index: 5;
    }

    .flower-wrap {
      position: absolute;
      bottom: 0;
      transform: translateX(-50%);
    }

    /* flower picker panel: a slim horizontal bar that sits in the grass */
    .flower-picker {
      position: absolute;
      bottom: 8px;
      right: 12px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 0.6em;
      background: var(--bg);
      border: 1px solid var(--p-color);
      border-radius: 10px;
      padding: 0.35em 0.7em;
      font-family: Montserrat, Monaco, Garamond;
      font-size: 0.78em;
      color: var(--p-color);
      opacity: 0.9;
      transition: opacity 0.2s;
    }
    .flower-picker:hover { opacity: 1; }
    .fp-title {
      opacity: 0.8;
      white-space: nowrap;
    }
    .fp-row {
      display: flex;
      gap: 0.35em;
      align-items: center;
    }
    .fp-style {
      width: 2em; height: 2em;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--li-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      flex-shrink: 0;
    }
    .fp-style.selected {
      border-color: var(--accent);
      background: rgba(255,255,255,0.15);
    }
    .fp-style svg {
      width: 100%;
      height: 100%;
    }
    .fp-color {
      width: 1.4em; height: 1.4em;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
    }
    .fp-color.selected {
      border-color: var(--h-color);
    }
    .fp-add {
      padding: 0.3em 0.6em;
      border-radius: 6px;
      border: 1px solid var(--li-color);
      background: rgba(255,255,255,0.06);
      color: var(--p-color);
      font-family: inherit;
      font-size: 0.95em;
      cursor: pointer;
      white-space: nowrap;
    }
    .fp-add:hover { background: rgba(255,255,255,0.15); }
    .fp-clear {
      opacity: 0.6;
      font-size: 0.85em;
    }
    .fp-clear:hover { opacity: 1; }

    /* phone screens: shrink the nav and flower picker so nothing overflows */
    @media (max-width: 600px) {
      nav {
        max-width: calc(100% - 36px);
        font-size: 0.8em;
        line-height: 1.6;
      }
      .greeting h1 { font-size: 1.4em; }
      .flower-picker {
        left: 8px;
        right: auto;
        width: calc(100vw - 16px);
        bottom: 6px;
        font-size: 0.45em;
        gap: 0.2em;
        padding: 0.2em 0.3em;
        justify-content: center;
        flex-wrap: wrap;
      }
      .fp-title { display: none; }
      .fp-add { font-size: 0.85em; padding: 0.25em 0.35em; }
    }
  </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" title="toggle light/dark">&#127769;</button>

<nav>
  <a href="about.html">About</a>
  🌸
  <a href="projects.html">Projects</a>
  🌸
  <a href="weblog.html">Weblog</a>
  🌸
  <a href="contact.html">Contact</a>
  🌸
  <a href="42.html"><img src="images/a_pfp.jpg" alt="An image, I suppose" style="width:1em;height:1em;vertical-align:middle;"></a>
</nav>

<div id="stars"></div>

<div class="greeting">
  <h1>Hello World!</h1>
  <p>I'm Aditi.</p>
</div>

<div class="flower-picker">
  <div class="fp-title">add a flower</div>
  <div class="fp-row" id="fp-styles"></div>
  <div class="fp-row" id="fp-colors"></div>
  <button class="fp-add fp-clear" onclick="clearAll()">clear all</button>
</div>

<div class="grass">
  <svg id="grass-svg" viewBox="0 0 1440 24" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path id="grass-path" fill="var(--g-grass)"/>
  </svg>
</div>

<div id="garden"></div>

<script>
function toggleTheme() {
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  renderGarden();
}

/* stars */
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2 + 0.7;
  s.style.cssText = `width:${sz}px;height:${sz}px;top:${Math.random()*65}%;left:${Math.random()*100}%`;
  starsEl.appendChild(s);
}

/* grass blades */
(function() {
  let d = 'M0,24 L0,22';
  for (let x = 0; x <= 1440; x += 5) {
    const r = Math.random();
    const y = r < 0.15 ? 0 + Math.random()*3
            : r < 0.4  ? 6 + Math.random()*6
            : 14 + Math.random()*8;
    d += ` L${x},${y.toFixed(1)}`;
  }
  d += ' L1440,24 Z';
  document.getElementById('grass-path').setAttribute('d', d);
})();

/* ---- hand-drawn-ish, outline-only flower heads ---- */
/* a single continuous wavy outline: `tips` gives the petal-tip radius for
   each lobe (uneven = hand-drawn look), `trough` is the radius of the
   notches between petals */
function organicOutline(tips, trough, color, center) {
  const n = tips.length;
  const step = (2 * Math.PI) / n;
  const pt = (angle, r) => [Math.sin(angle) * r, -Math.cos(angle) * r];
  let d = '';
  for (let i = 0; i < n; i++) {
    const angle = step * i;
    const [tx, ty] = pt(angle, tips[i]);
    const [sx, sy] = pt(angle - step / 2, trough);
    const [ex, ey] = pt(angle + step / 2, trough);
    const ctrlR = (trough + tips[i]) / 2;
    const [c1x, c1y] = pt(angle - step * 0.22, ctrlR);
    const [c2x, c2y] = pt(angle + step * 0.22, ctrlR);
    if (i === 0) d += `M${sx.toFixed(1)},${sy.toFixed(1)} `;
    d += `Q${c1x.toFixed(1)},${c1y.toFixed(1)} ${tx.toFixed(1)},${ty.toFixed(1)} `;
    d += `Q${c2x.toFixed(1)},${c2y.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)} `;
  }
  d += 'Z';
  const dot = center ? `<circle r="${center}" fill="var(--g-center)" stroke="${color}" stroke-width="1.4"/>` : '';
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>${dot}`;
}

/* a cup-shaped 3-petal tulip outline, opening upward from a narrow base */
function tulipOutline(color) {
  const d = 'M-5,0 '
    + 'C-9,-1 -11,-7 -10,-13 '
    + 'Q-6.5,-10 -4.5,-8.5 '
    + 'Q-1.5,-15 0,-18 '
    + 'Q1.5,-15 4.5,-8.5 '
    + 'Q6.5,-10 10,-13 '
    + 'C11,-7 9,-1 5,0 '
    + 'Z';
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>`;
}

const FLOWER_STYLES = {
  daisy: (color) => organicOutline([13.2, 10.2, 15, 10.8, 15.6, 11.4], 4.2, color, 4.2),
  tulip: (color) => tulipOutline(color),
  star:  (color) => organicOutline([15.6, 10.8, 13.8, 10.2, 15], 3, color, 3.6),
  round: (color) => organicOutline([8.4, 7.8, 9.4, 7.4, 8.9, 7.2, 9.1, 7.7], 6.6, color, 4.8),
};
const STYLE_NAMES = Object.keys(FLOWER_STYLES);

const COLORS = ['#F5EEFF','#D7C5F2','#C7A8E4','#9878C8','#EDC9E0','#F6D6A8','#BFE3CF','#9CC6E8'];

/* render a full flower svg (stem + leaf + head), no animation, no links */
function flowerSVG(style, color, h) {
  const svgW = 56, svgH = h + 40;
  const CX = 28, stemTop = 22, stemBot = svgH - 6;
  const leafY = stemTop + (stemBot - stemTop) * 0.4;
  const head = FLOWER_STYLES[style](color);
  return `<svg width="${svgW}" height="${svgH}" viewBox="0 0 ${svgW} ${svgH}" style="display:block">
    <line x1="${CX}" y1="${stemTop}" x2="${CX}" y2="${stemBot}" stroke="var(--g-stem)" stroke-width="1.4"/>
    <path d="M${CX},${leafY.toFixed(1)} q9,-2 9,6 q-9,2 -9,-6 Z" fill="none" stroke="var(--g-stem)" stroke-width="1.2"/>
    <g transform="translate(${CX},${stemTop})">${head}</g>
  </svg>`;
}

/* small icon preview for the style picker */
function styleIcon(style, color) {
  return `<svg width="22" height="22" viewBox="-12 -20 24 22">${FLOWER_STYLES[style](color)}</svg>`;
}

/* base decorative garden: a fresh random little spread, generated each visit */
const OUTLINE_VARS = ['var(--g-outline-1)','var(--g-outline-2)','var(--g-outline-3)','var(--g-outline-4)'];
function randomBaseFlowers() {
  const n = 8 + Math.floor(Math.random() * 3);
  const slot = 100 / n;
  const flowers = [];
  for (let i = 0; i < n; i++) {
    flowers.push({
      style: STYLE_NAMES[Math.floor(Math.random() * STYLE_NAMES.length)],
      color: OUTLINE_VARS[Math.floor(Math.random() * OUTLINE_VARS.length)],
      x: Math.round(slot * i + slot * 0.2 + Math.random() * slot * 0.6),
      h: Math.round(Math.random() * 60 + 65)
    });
  }
  return flowers;
}
let BASE_FLOWERS = randomBaseFlowers();

/* ---- flower picker state ---- */
let selectedColor = COLORS[0];

const fpStyles = document.getElementById('fp-styles');
STYLE_NAMES.forEach(name => {
  const btn = document.createElement('button');
  btn.className = 'fp-style';
  btn.innerHTML = styleIcon(name, selectedColor);
  btn.title = 'add ' + name;
  btn.onclick = () => addFlower(name);
  fpStyles.appendChild(btn);
});

function refreshStyleIcons() {
  fpStyles.querySelectorAll('.fp-style').forEach((btn, i) => {
    btn.innerHTML = styleIcon(STYLE_NAMES[i], selectedColor);
  });
}

const fpColors = document.getElementById('fp-colors');
COLORS.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'fp-color' + (c === selectedColor ? ' selected' : '');
  btn.style.background = c;
  btn.title = c;
  btn.onclick = () => {
    selectedColor = c;
    fpColors.querySelectorAll('.fp-color').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    refreshStyleIcons();
  };
  fpColors.appendChild(btn);
});

function getMyFlowers() {
  try {
    return JSON.parse(localStorage.getItem('myGardenFlowers')) || [];
  } catch (e) {
    return [];
  }
}

/* pick an x position: 80% of the time, fill the widthwise gap with
   the fewest flowers; 20% of the time, just go fully random */
function pickX() {
  if (Math.random() < 0.2) {
    return Math.round(Math.random() * 88 + 4);
  }
  const bins = 16;
  const binWidth = 100 / bins;
  const counts = new Array(bins).fill(0);
  BASE_FLOWERS.concat(getMyFlowers()).forEach(f => {
    const b = Math.min(bins - 1, Math.floor(f.x / binWidth));
    counts[b]++;
  });
  const minCount = Math.min(...counts);
  const candidates = [];
  counts.forEach((c, i) => { if (c === minCount) candidates.push(i); });
  const bin = candidates[Math.floor(Math.random() * candidates.length)];
  return Math.round(bin * binWidth + Math.random() * binWidth);
}

function addFlower(style) {
  const flowers = getMyFlowers();
  flowers.push({
    style: style,
    color: selectedColor,
    x: pickX(),
    h: Math.round(Math.random() * 70 + 60)
  });
  localStorage.setItem('myGardenFlowers', JSON.stringify(flowers));
  renderGarden();
}

function clearAll() {
  localStorage.removeItem('myGardenFlowers');
  BASE_FLOWERS = randomBaseFlowers();
  renderGarden();
}

const gardenEl = document.getElementById('garden');

function renderGarden() {
  gardenEl.innerHTML = '';
  const all = BASE_FLOWERS.concat(getMyFlowers());
  all.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'flower-wrap';
    wrap.style.left = f.x + '%';
    wrap.innerHTML = flowerSVG(f.style, f.color, f.h);
    gardenEl.appendChild(wrap);
  });
}

renderGarden();
</script>
</body>
</html>
